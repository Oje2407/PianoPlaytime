name: iOS build and TestFlight upload

# Run this by hand from the Actions tab once the four Apple secrets are added.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and copy the app into the iOS project
        run: |
          npm ci
          npx cap sync ios

      - name: Save App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
          sed "s/TEAM_ID_HERE/${{ secrets.APPLE_TEAM_ID }}/" ios/export/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive (Xcode signs automatically using the API key)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LittleKeys.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}" \
            archive

      - name: Export and upload to App Store Connect (TestFlight)
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LittleKeys.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"
