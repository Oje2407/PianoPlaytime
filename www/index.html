<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Little Keys</title>
<style>
@font-face{font-family:"Baloo 2";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one-screen app. Header + tabs on top, scrolling lesson stage in the middle, a real-looking keyboard docked at the bottom. */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --ink:#1B2240; --muted:#5A6386; --line:#D9E0EE; --chip:#E3E9F6;
  --lid:#1E2236; --felt:#9E2A3A; --key-white:#FDFDFB; --key-edge:#C9CEDB; --key-black:#1F2230; --key-black-top:#3A3F52;
  --n-C:#E5484D; --n-D:#F0812A; --n-E:#F2C21B; --n-F:#3AA65A; --n-G:#2D95D8; --n-A:#5B5BD6; --n-B:#A64FCF; --sharp:#F2C21B;
  --good:#2E9E5B; --bad:#D9483B;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121729; --surface:#1B2240; --ink:#EEF1FA; --muted:#A4ADCA; --line:#2C3458; --chip:#262E52; --lid:#0B0E1A; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#121729; --surface:#1B2240; --ink:#EEF1FA; --muted:#A4ADCA; --line:#2C3458; --chip:#262E52; --lid:#0B0E1A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.key:focus-visible{outline:3px solid var(--n-G);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.01em;margin:0}
.brand span:nth-child(1){color:var(--n-C)}.brand span:nth-child(2){color:var(--n-D)}.brand span:nth-child(3){color:var(--n-E)}.brand span:nth-child(4){color:var(--n-G)}
.stars{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.stars b{color:var(--n-E)}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;width:100%;max-width:520px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,25,50,.15)}

/* stage */
.stage{flex:1;min-height:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.15;margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{color:var(--muted);margin:0;max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;background:var(--c,var(--n-G))}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:.9rem}
.rate{letter-spacing:2px;color:var(--line);font-size:1.05rem}
.rate i{font-style:normal;color:var(--n-E)}
.diff{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px 0}
.say{font-size:clamp(1.1rem,3vw,1.35rem);margin:0;max-width:52ch;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 18px;font-family:var(--f-display);font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:1.5em;margin:0;font-weight:700}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}

/* note bubbles */
.bubbles{position:relative;display:flex;gap:8px;overflow-x:auto;padding:14px 10px 10px;scrollbar-width:thin}
.bub{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.bub .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:#fff;background:var(--c);transition:transform .2s,opacity .2s}
.bub.lt .dot{color:#2A2400}
.bub small{font-size:.85rem;color:var(--muted);white-space:nowrap}
.bub .fing{font-size:.72rem;font-weight:700;color:var(--muted)}
.bub.done .dot{opacity:.35;transform:scale(.85)}
.bub.cur .dot{transform:scale(1.18);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--c)}
.bub.cur small{color:var(--ink);font-weight:700}

/* games */
.bigcard{align-self:center;width:min(240px,70vw);aspect-ratio:1;max-width:100%;border-radius:28px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display)}
.bigcard.lt{color:#2A2400}
.bigcard b{font-size:6.5rem;line-height:.9;font-weight:800}
.bigcard span{font-size:1.4rem;font-weight:700}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:50%;background:var(--chip)}
.pip.on{background:var(--good)}
.pip.miss{background:var(--bad)}
.lives{font-size:1.2rem;letter-spacing:3px;color:var(--n-C)}
.status{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}

/* free play */
.now{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.now .bigcard{width:120px;border-radius:20px}
.now .bigcard b{font-size:3.6rem}.now .bigcard span{font-size:1rem}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
details li{margin:4px 0}

/* keyboard dock */
.dock{flex:none;background:var(--lid);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px max(10px,env(safe-area-inset-bottom,0px))}
.lidline{max-width:1100px;margin:0 auto 6px;display:flex;justify-content:space-between;color:#8E95B0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
.keys{position:relative;display:flex;max-width:1100px;margin:0 auto;height:clamp(140px,26vh,220px);touch-action:none;user-select:none;-webkit-user-select:none;border-top:5px solid var(--felt)}
.key{-webkit-tap-highlight-color:transparent}
.white{flex:1;min-width:0;background:var(--key-white);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 10px 10px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:10px;transition:background .08s,transform .08s;transform-origin:top}
.white .lab{width:min(30px,80%);aspect-ratio:1;border-radius:50%;background:var(--nc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(.8rem,2.4vw,1.05rem);line-height:1}
.white.lt .lab{color:#2A2400}
.white .mid{font-size:.6rem;font-weight:700;color:#7A8096;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.nolabels .white .lab{background:transparent;color:transparent;box-shadow:inset 0 -4px 0 var(--nc)}
.white.down{background:color-mix(in srgb,var(--nc) 38%,var(--key-white));transform:scaleY(.985)}
.black{position:absolute;top:0;height:60%;background:linear-gradient(var(--key-black-top),var(--key-black) 30%);border-radius:0 0 7px 7px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.35);transition:background .08s}
.black.down{background:var(--key-black-top)}
.key.target{animation:pulse 1.1s ease-in-out infinite}
.white.target{background:color-mix(in srgb,var(--nc) 22%,var(--key-white))}
.white.target::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--nc);animation:bob 1.1s ease-in-out infinite}
.black.target{background:linear-gradient(var(--sharp),#B88C00)}
.key.nope{animation:shake .3s}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--nc)}}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}

/* celebration */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:16px}
.modal .panel{max-width:380px;width:100%;text-align:center;align-items:center}
.bigstars{font-size:3rem;letter-spacing:6px;color:var(--line);line-height:1}
.bigstars i{font-style:normal;color:var(--n-E);display:inline-block;animation:pop .45s backwards}
.bigstars i:nth-child(2){animation-delay:.15s}.bigstars i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}

@media (max-width:520px){
  .brand{font-size:1.35rem}
  .tabs button{font-size:.92rem;padding:7px 4px}
  .now{grid-template-columns:1fr;justify-items:center;text-align:center}
}
/* phones held sideways: one compact header row, taller keys */
@media (max-height:500px){
  .top{flex-wrap:nowrap;padding-block:max(6px,env(safe-area-inset-top,0px)) 4px}
  .brand{font-size:1.2rem;white-space:nowrap}
  .tabs{order:2;max-width:440px;margin-left:auto}
  .stars{order:3;margin-left:0}
  .tabs button{padding:5px 4px;font-size:.9rem}
  .lidline{display:none}
  .dock{padding-block:6px max(6px,env(safe-area-inset-bottom,0px))}
  .keys{height:44vh}
  .stage{padding-block:4px 8px}
  .panel{padding:12px;gap:8px}
  .say{font-size:1.05rem}
  h2{font-size:1.3rem}
  .back{padding:0}
  .wrap{gap:8px}
  .bub .dot{width:36px;height:36px;font-size:1.1rem}
  .bigcard{width:min(150px,30vh)}
  .bigcard b{font-size:4rem}
}
@media (pointer:coarse){.desk{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand"><span>L</span><span>i</span><span>t</span><span>t</span>le Keys</h1>
    <div class="stars" title="Stars earned"><b>★</b><span id="starCount">0</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="learn" aria-selected="true">Learn</button>
      <button role="tab" data-tab="songs" aria-selected="false">Songs</button>
      <button role="tab" data-tab="games" aria-selected="false">Games</button>
      <button role="tab" data-tab="play" aria-selected="false">Free play</button>
    </nav>
  </header>
  <main class="stage" id="stage"></main>
  <div class="dock">
    <div class="lidline"><span>Little Keys</span><span id="lidHint">Tap or slide along the keys</span></div>
    <div class="keys" id="keys" aria-label="Piano keyboard"></div>
  </div>
</div>
<div class="modal" id="modal" hidden></div>

<script>
const PCS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ANIMAL={C:'Cat',D:'Dog',E:'Elephant',F:'Frog',G:'Goat',A:'Ant',B:'Bear'};
const FINGER={C:1,D:2,E:3,F:4,G:5};
const midi=n=>{const m=n.match(/^([A-G]#?)(\d)$/);return PCS.indexOf(m[1])+12*(+m[2]+1)};
const hz=n=>440*Math.pow(2,(midi(n)-69)/12);
const pc=n=>n.replace(/\d/,'');
const isLight=l=>l==='E';
const col=n=>n.includes('#')?'var(--sharp)':`var(--n-${n[0]})`;
const matches=(t,n)=>/\d/.test(t)?t===n:pc(n)===t;
const $=s=>document.querySelector(s);
const stage=$('#stage'), keysEl=$('#keys'), modal=$('#modal');

/* ---------- saved progress & settings ---------- */
const store={best:{},labels:true,sound:'piano'};
try{Object.assign(store,JSON.parse(localStorage.getItem('littlekeys.v1')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('littlekeys.v1',JSON.stringify(store))}catch(e){}}
function award(id,s){if((store.best[id]||0)<s){store.best[id]=s;save()}updateStars()}
function updateStars(){$('#starCount').textContent=Object.values(store.best).reduce((a,b)=>a+b,0)}
const rate=s=>`<span class="rate">${[1,2,3].map(i=>i<=s?'<i>★</i>':'★').join('')}</span>`;

/* ---------- sound ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ac=new AC();
    master=ac.createGain();master.gain.value=.7;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}
  if(ac.state==='suspended')ac.resume();return ac;
}
function tone(note,delay=0){
  const a=audio();if(!a)return;const t=a.currentTime+delay+.005,f=hz(note);
  const bells=store.sound==='bells',len=bells?2.4:1.5;
  const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*9);lp.connect(g);g.connect(master);
  const parts=bells?[[1,'sine',1],[2.76,'sine',.22],[5.4,'sine',.07]]:[[1,'triangle',1],[2,'sine',.3],[3,'sine',.1]];
  parts.forEach(([m,type,v])=>{const o=a.createOscillator();o.type=type;o.frequency.value=f*m;const og=a.createGain();og.gain.value=v;o.connect(og);og.connect(lp);o.start(t);o.stop(t+len+.1)});
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.008);g.gain.exponentialRampToValueAtTime(.1,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+len);
}
const fanfare=()=>['C4','E4','G4','C5'].forEach((n,i)=>later(()=>{tone(n);flash(n,200)},i*140));

/* ---------- timers ---------- */
let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};

/* ---------- keyboard ---------- */
const KEYMAP={a:'C4',w:'C#4',s:'D4',e:'D#4',d:'E4',f:'F4',t:'F#4',g:'G4',y:'G#4',h:'A4',u:'A#4',j:'B4',k:'C5',o:'C#5',l:'D5',p:'D#5',';':'E5'};
let octaves=0;
function buildKeys(){
  octaves=window.innerWidth<640?1:2;
  const notes=[];for(let o=4;o<4+octaves;o++)PCS.forEach(p=>notes.push(p+o));notes.push('C'+(4+octaves));
  const whites=notes.filter(n=>!n.includes('#')),w=100/whites.length;
  let html='',wi=0;
  notes.forEach(n=>{
    if(!n.includes('#')){html+=`<div class="key white${isLight(n[0])?' lt':''}" data-note="${n}" style="--nc:${col(n)}" role="button" aria-label="${n}"><span class="lab">${n[0]}</span>${n==='C4'?'<span class="mid">middle C</span>':''}</div>`;wi++}
    else html+=`<div class="key black" data-note="${n}" style="--nc:var(--sharp);left:calc(${wi*w}% - ${w*0.31}%);width:${w*0.62}%" role="button" aria-label="${n}"></div>`;
  });
  keysEl.innerHTML=html;keysEl.classList.toggle('nolabels',!store.labels);glow();
}
const keyEl=n=>keysEl.querySelector(`[data-note="${n}"]`);
function flash(n,ms=220){const k=keyEl(n);if(!k)return;k.classList.add('down');setTimeout(()=>k.classList.remove('down'),ms)}
function nope(n){const k=keyEl(n);if(!k)return;k.classList.remove('nope');void k.offsetWidth;k.classList.add('nope')}
function glow(){
  keysEl.querySelectorAll('.target').forEach(k=>k.classList.remove('target'));
  const t=activity&&activity.targets?activity.targets():[];
  keysEl.querySelectorAll('.key').forEach(k=>{if(t.some(x=>matches(x,k.dataset.note)))k.classList.add('target')});
}
let dragging=false,lastDrag=null;
keysEl.addEventListener('pointerdown',e=>{const k=e.target.closest('.key');if(!k)return;e.preventDefault();dragging=true;lastDrag=k;press(k.dataset.note)});
keysEl.addEventListener('pointermove',e=>{if(!dragging)return;const el=document.elementFromPoint(e.clientX,e.clientY);const k=el&&el.closest&&el.closest('.key');if(k&&k!==lastDrag){lastDrag=k;press(k.dataset.note)}});
addEventListener('pointerup',()=>{dragging=false;lastDrag=null});
addEventListener('pointercancel',()=>{dragging=false;lastDrag=null});
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;const n=KEYMAP[e.key.toLowerCase()];if(n&&keyEl(n)){e.preventDefault();press(n)}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if((window.innerWidth<640?1:2)!==octaves)buildKeys()},150)});

let activity=null;
function press(n){tone(n);flash(n);if(activity&&!activity.locked)activity.onNote(n)}

/* ---------- content ---------- */
const LESSONS=[
 {id:'twins',title:'Find the twins',blurb:'Black keys come in groups of two and three.',steps:[
   {say:'Look at the black keys. Some sit in pairs, like twins. Press one of the twins.',any:['C#','D#']},
   {say:'Now find a black key in the group of three.',any:['F#','G#','A#']},
   {say:'C is the white key just to the left of the twins. C is for Cat. Press C.',seq:['C']}]},
 {id:'cde',title:'C, D and E',blurb:'The three white keys around the twins.',steps:[
   {say:'D is the Dog in the middle of the twins. Press D.',seq:['D']},
   {say:'E is the Elephant on the right of the twins. Press E.',seq:['E']},
   {say:'Play C, D, E going up, like climbing stairs.',seq:['C','D','E']},
   {say:'Now go down: E, D, C. That is how Hot Cross Buns starts!',seq:['E','D','C']}]},
 {id:'thumb',title:'Five finger home',blurb:'Fingers 1 to 5 on C D E F G.',fingers:true,steps:[
   {say:'Put your right thumb on middle C. Your thumb is finger 1. Press C.',seq:['C4']},
   {say:'Each finger gets its own key. Play 1, 2, 3, 4, 5.',seq:['C4','D4','E4','F4','G4']},
   {say:'Walk back down: 5, 4, 3, 2, 1.',seq:['G4','F4','E4','D4','C4']}]},
 {id:'fgab',title:'F, G, A and B',blurb:'The keys around the three black keys.',steps:[
   {say:'F is the Frog, just left of the three black keys. Press F.',seq:['F']},
   {say:'G is the Goat, A is the Ant and B is the Bear. Play F, G, A, B.',seq:['F','G','A','B']},
   {say:'Back down again: B, A, G, F.',seq:['B','A','G','F']}]},
 {id:'scale',title:'Climb the ladder',blurb:'Your first scale: C major.',steps:[
   {say:'Play every white key from middle C up to the next C. This is called the C major scale.',seq:['C4','D4','E4','F4','G4','A4','B4','C5']},
   {say:'Brilliant! Now climb all the way back down.',seq:['C5','B4','A4','G4','F4','E4','D4','C4']}]},
];
const S=(str)=>str.trim().split(/\s+/).map(t=>{const[n,b,l]=t.split('|');return{n:n+'4',beats:+b||1,lyric:l||''}});
const SONGS=[
 {id:'buns',title:'Hot Cross Buns',diff:'Easy',c:'var(--n-E)',notes:'3 notes: C D E',
  seq:S('E|1|Hot D|1|cross C|2|buns E|1|hot D|1|cross C|2|buns C|.5|one C|.5|a C|.5|pen- C|.5|ny D|.5|two D|.5|a D|.5|pen- D|.5|ny E|1|hot D|1|cross C|2|buns')},
 {id:'mary',title:'Mary Had a Little Lamb',diff:'Easy',c:'var(--n-C)',notes:'4 notes: C D E G',
  seq:S('E|1|Ma- D|1|ry C|1|had D|1|a E|1|lit- E|1|tle E|2|lamb D|1|lit- D|1|tle D|2|lamb E|1|lit- G|1|tle G|2|lamb E|1|Ma- D|1|ry C|1|had D|1|a E|1|lit- E|1|tle E|1|lamb E|1|its D|1|fleece D|1|was E|1|white D|1|as C|4|snow')},
 {id:'ode',title:'Ode to Joy',diff:'Medium',c:'var(--n-G)',notes:'5 notes: C to G',
  seq:S('E E F G G F E D C C D E E|1.5 D|.5 D|2 E E F G G F E D C C D E D|1.5 C|.5 C|2')},
 {id:'twinkle',title:'Twinkle Twinkle Little Star',diff:'Medium',c:'var(--n-A)',notes:'6 notes: C to A',
  seq:S('C|1|Twin- C|1|kle G|1|twin- G|1|kle A|1|lit- A|1|tle G|2|star F|1|how F|1|I E|1|won- E|1|der D|1|what D|1|you C|2|are G|1|Up G|1|a- F|1|bove F|1|the E|1|world E|1|so D|2|high G|1|like G|1|a F|1|dia- F|1|mond E|1|in E|1|the D|2|sky C|1|Twin- C|1|kle G|1|twin- G|1|kle A|1|lit- A|1|tle G|2|star F|1|how F|1|I E|1|won- E|1|der D|1|what D|1|you C|2|are')},
 {id:'jingle',title:'Jingle Bells',diff:'Tricky',c:'var(--n-F)',notes:'5 notes, with a jump',
  seq:S('E|1|Jin- E|1|gle E|2|bells E|1|jin- E|1|gle E|2|bells E|1|jin- G|1|gle C|1.5|all D|.5|the E|4|way F|1|Oh F|1|what F|1.5|fun F|.5|it F|1|is E|1|to E|1|ride E|.5|in E|.5|a E|1|one D|1|horse D|1|o- E|1|pen D|2|sleigh, G|2|hey!')},
];

/* ---------- shared pieces ---------- */
function bubbles(el,seq,i,{fingers=false}={}){
  el.innerHTML=seq.map((s,k)=>{const l=s.n[0];return `<div class="bub${isLight(l)?' lt':''}${k<i?' done':''}${k===i?' cur':''}" style="--c:${col(s.n)}"><span class="dot">${l}</span>${s.lyric?`<small>${s.lyric}</small>`:''}${fingers&&FINGER[l]?`<span class="fing">finger ${FINGER[l]}</span>`:''}</div>`}).join('');
  const cur=el.querySelector('.cur');if(cur)el.scrollTo({left:cur.offsetLeft-el.clientWidth/2+cur.offsetWidth/2,behavior:'smooth'});
}
function runner(seq,onStep,onDone){
  const r={i:0,mistakes:0,locked:false,
    targets:()=>r.i<seq.length?[seq[r.i].n]:[],
    onNote(n){if(r.i>=seq.length)return;
      if(matches(seq[r.i].n,n)){r.i++;onStep(true,n);glow();if(r.i>=seq.length)onDone()}
      else{r.mistakes++;nope(n);onStep(false,n)}}};
  return r;
}
function playBack(seq,bubEl,opts,bpm=100,after){
  const beat=60/bpm*1000;let t=300;activity.locked=true;
  seq.forEach((s,k)=>{later(()=>{tone(s.n);flash(s.n,Math.min(beat*s.beats*.8,500));bubbles(bubEl,seq,k,opts)},t);t+=beat*s.beats});
  later(()=>{activity.locked=false;after&&after()},t);
}
function fb(text,cls=''){const el=$('#fb');if(el){el.textContent=text;el.className='fb '+cls}}
const PRAISE=['Great!','Yes!','Super!','Well done!','Nice one!'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

function celebrate({title,msg,stars,again,next}){
  modal.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="bigstars">${[1,2,3].map(i=>i<=stars?'<i>★</i>':'★').join('')}</div><h2 id="ct">${title}</h2><p class="lede">${msg}</p><div class="row" style="justify-content:center">${next?'<button class="btn" id="mNext">Next</button>':''}<button class="btn ghost" id="mAgain">Play again</button><button class="btn ghost" id="mBack">Back</button></div></div>`;
  modal.hidden=false;fanfare();
  const close=()=>{modal.hidden=true;modal.innerHTML=''};
  $('#mAgain').onclick=()=>{close();again()};$('#mBack').onclick=()=>{close();show(tab)};
  if(next)$('#mNext').onclick=()=>{close();next()};
  (next?$('#mNext'):$('#mAgain')).focus();
}

/* ---------- views ---------- */
let tab='learn';
function show(t){
  tab=t;clearTimers();activity=null;modal.hidden=true;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ({learn:viewLearn,songs:viewSongs,games:viewGames,play:viewPlay})[t]();glow();stage.scrollTop=0;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));

function viewLearn(){
  const colors=['var(--n-C)','var(--n-D)','var(--n-F)','var(--n-G)','var(--n-A)'];
  stage.innerHTML=`<div class="wrap"><div><p class="eyebrow">Lessons</p><h2>Learn the keyboard, one step at a time</h2></div>
  <div class="grid">${LESSONS.map((L,i)=>`<button class="card" data-i="${i}" style="--c:${colors[i]}"><span class="num">${i+1}</span><h3>${L.title}</h3><p>${L.blurb}</p><div class="meta"><span class="diff">${L.steps.length} steps</span>${rate(store.best['lesson:'+L.id]||0)}</div></button>`).join('')}</div>
  <details><summary>Tips for grown-ups</summary><ul>
   <li>Sit your child level with middle C, feet flat or on a box, elbows just above the keys.</li>
   <li>Little and often works best: ten minutes a day beats an hour once a week.</li>
   <li>Lessons 1 to 3 cover the first five songs. Let them repeat a favourite as many times as they like.</li>
   <li class="desk">On a computer, the letter keys A to K play the white notes, and W E T Y U play the black ones.</li></ul></details></div>`;
  stage.querySelectorAll('.card').forEach(c=>c.onclick=()=>openLesson(+c.dataset.i));
}

function openLesson(idx){
  clearTimers();const L=LESSONS[idx];let s=0;
  function step(){
    const st=L.steps[s];
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All lessons</button><div class="panel">
      <p class="eyebrow">Lesson ${idx+1} · Step ${s+1} of ${L.steps.length}</p><h2>${L.title}</h2>
      <p class="say">${st.say}</p>${st.seq?'<div class="bubbles" id="bub"></div>':''}
      <p class="fb" id="fb">Watch for the glowing key${st.seq&&st.seq.length>1?'s':''}.</p>
      ${st.seq&&st.seq.length>1?'<div class="row"><button class="btn ghost" id="hear">Hear it first</button></div>':''}</div></div>`;
    $('#back').onclick=()=>show('learn');
    if(st.any){
      activity={locked:false,targets:()=>st.any,onNote(n){if(st.any.includes(pc(n)))done();else{nope(n);fb('Not that one. Look for the glowing keys.','no')}}};
    }else{
      const seq=st.seq.map(n=>({n})),bub=$('#bub'),opts={fingers:!!L.fingers};
      activity=runner(seq,(ok)=>{bubbles(bub,seq,activity.i,opts);if(!ok)fb('Oops! Find the glowing key.','no');else fb('')},done);
      bubbles(bub,seq,0,opts);
      const h=$('#hear');if(h)h.onclick=()=>{const sv=activity.i;playBack(seq,bub,opts,110,()=>{bubbles(bub,seq,sv,opts);glow()})};
    }
    glow();
  }
  function done(){
    activity.locked=true;fb(pick(PRAISE),'ok');
    later(()=>{s++;if(s<L.steps.length)step();else{award('lesson:'+L.id,3);
      celebrate({title:'Lesson complete!',msg:`You finished “${L.title}”.`,stars:3,again:()=>openLesson(idx),next:idx+1<LESSONS.length?()=>openLesson(idx+1):()=>show('songs')})}},900);
  }
  step();
}

function viewSongs(){
  stage.innerHTML=`<div class="wrap"><div><p class="eyebrow">Songs</p><h2>Play along with the glowing keys</h2></div>
  <div class="grid">${SONGS.map((g,i)=>`<button class="card" data-i="${i}" style="--c:${g.c}"><span class="num">♪</span><h3>${g.title}</h3><p>${g.notes}</p><div class="meta"><span class="diff">${g.diff}</span>${rate(store.best['song:'+g.id]||0)}</div></button>`).join('')}</div></div>`;
  stage.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSong(+c.dataset.i));
}

function openSong(idx){
  clearTimers();const g=SONGS[idx],seq=g.seq;
  stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All songs</button><div class="panel">
    <p class="eyebrow">${g.diff} · ${seq.length} notes</p><h2>${g.title}</h2>
    <div class="bubbles" id="bub"></div><p class="fb" id="fb">Press the glowing key to play the next note.</p>
    <div class="row"><button class="btn ghost" id="listen">Listen first</button><button class="btn ghost" id="restart">Start again</button></div></div></div>`;
  $('#back').onclick=()=>show('songs');
  const bub=$('#bub');
  activity=runner(seq,(ok)=>{bubbles(bub,seq,activity.i);fb(ok?'':'Not quite. Find the glowing key.',ok?'':'no')},()=>{
    activity.locked=true;const m=activity.mistakes,st=m<=2?3:m<=6?2:1;award('song:'+g.id,st);
    later(()=>celebrate({title:'You played it!',msg:m===0?'Not a single slip. Amazing!':`${m} little slip${m>1?'s':''}. Play again to win more stars.`,stars:st,again:()=>openSong(idx),next:idx+1<SONGS.length?()=>openSong(idx+1):null}),500);
  });
  bubbles(bub,seq,0);
  $('#listen').onclick=()=>{const sv=activity.i;playBack(seq,bub,{},g.id==='jingle'?140:100,()=>{bubbles(bub,seq,sv);glow()})};
  $('#restart').onclick=()=>openSong(idx);
}

function viewGames(){
  stage.innerHTML=`<div class="wrap"><div><p class="eyebrow">Games</p><h2>Practise without noticing</h2></div><div class="grid">
   <button class="card" id="gDet" style="--c:var(--n-D)"><span class="num">?</span><h3>Note Detective</h3><p>A letter appears. Can you find its key? Ten rounds.</p><div class="meta"><span class="diff">Reading notes</span>${rate(store.best['game:detective']||0)}</div></button>
   <button class="card" id="gCat" style="--c:var(--n-B)"><span class="num">♫</span><h3>Copy Cat</h3><p>Listen to a little tune, then play it back. It grows each round.</p><div class="meta"><span class="diff">Listening</span>${rate(store.best['game:copycat']||0)}</div></button></div></div>`;
  $('#gDet').onclick=openDetective;$('#gCat').onclick=openCopyCat;
}

function openDetective(){
  clearTimers();const total=10;let round=0,results=[],target=null,first=true;
  function next(){
    if(round>=total)return finish();round++;first=true;let p;do{p='CDEFGAB'[Math.floor(Math.random()*7)]}while(p===target);target=p;
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All games</button><div class="panel">
      <p class="eyebrow">Note Detective · Round ${round} of ${total}</p>
      <div class="pips">${Array.from({length:total},(_,k)=>`<span class="pip ${results[k]===true?'on':results[k]===false?'miss':''}"></span>`).join('')}</div>
      <div class="bigcard${isLight(target)?' lt':''}" style="--c:${col(target)}"><b>${target}</b><span>${ANIMAL[target]}</span></div>
      <p class="say" style="text-align:center;align-self:center">Find <strong>${target}</strong> on the keyboard.</p>
      <p class="fb" id="fb" style="text-align:center"></p><div class="row" style="justify-content:center"><button class="btn ghost" id="hint">Show me</button></div></div></div>`;
    $('#back').onclick=()=>show('games');
    let hint=false;
    activity={locked:false,targets:()=>hint?[target]:[],onNote(n){
      if(pc(n)===target){activity.locked=true;results[round-1]=first;fb(pick(PRAISE),'ok');later(next,750)}
      else{first=false;nope(n);fb(n.includes('#')?'That was a black key. Try a white one!':`That was ${n[0]} for ${ANIMAL[n[0]]}. Try again!`,'no')}}};
    $('#hint').onclick=()=>{hint=true;first=false;glow()};glow();
  }
  function finish(){const c=results.filter(Boolean).length,st=c>=9?3:c>=6?2:c>=3?1:0;if(st)award('game:detective',st);
    celebrate({title:`${c} out of ${total}!`,msg:c>=9?'A real note detective.':'Keep practising and the letters will start to jump out.',stars:st,again:openDetective});}
  next();
}

function openCopyCat(){
  clearTimers();const MAX=8;let level=1,lives=3,seq=[],pos=0;
  const newSeq=()=>{const len=Math.min(2+Math.floor((level-1)/2),6);seq=Array.from({length:len},()=>'CDEFG'[Math.floor(Math.random()*5)]+'4')};
  function draw(msg){
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All games</button><div class="panel" style="align-items:center;text-align:center">
      <p class="eyebrow">Copy Cat · Tune ${level} of ${MAX}</p><span class="lives" aria-label="${lives} lives">${'♥'.repeat(lives)}${'<span style="color:var(--line)">♥</span>'.repeat(3-lives)}</span>
      <p class="status" id="status">${msg}</p><div class="pips">${seq.map((_,k)=>`<span class="pip ${k<pos?'on':''}"></span>`).join('')}</div>
      <p class="lede">Copy Cat uses C, D, E, F and G. Keep your hand on five finger home.</p>
      <button class="btn ghost" id="again">Hear it again</button></div></div>`;
    $('#back').onclick=()=>show('games');$('#again').onclick=()=>{if(!activity.locked)playSeq()};
  }
  function playSeq(){
    activity.locked=true;pos=0;draw('Listen…');
    seq.forEach((n,i)=>later(()=>{tone(n);flash(n,380)},500+i*620));
    later(()=>{activity.locked=false;draw('Your turn!')},500+seq.length*620);
  }
  activity={locked:true,targets:()=>[],onNote(n){
    if(pc(n)===pc(seq[pos])){pos++;draw('Your turn!');
      if(pos===seq.length){activity.locked=true;draw(pick(PRAISE));
        if(level>=MAX)later(finish,700);else later(()=>{level++;newSeq();playSeq()},1000)}}
    else{nope(n);lives--;if(lives<=0){activity.locked=true;later(finish,500)}else{draw('Oops! Listen again.');activity.locked=true;later(playSeq,1100)}}}};
  function finish(){const done=lives>0?MAX:level-1,st=done>=8?3:done>=5?2:done>=2?1:0;if(st)award('game:copycat',st);
    celebrate({title:lives>0?'Copy Cat champion!':`You copied ${done} tune${done===1?'':'s'}`,msg:lives>0?'You played back every tune.':'Your ears get sharper every time you play.',stars:st,again:openCopyCat});}
  newSeq();draw('Get ready…');later(playSeq,400);
}

function viewPlay(){
  stage.innerHTML=`<div class="wrap"><div><p class="eyebrow">Free play</p><h2>Make up your own music</h2></div>
   <div class="panel"><div class="now"><div class="bigcard" id="nowCard" style="--c:var(--chip);color:var(--muted)"><b>♪</b><span>Play!</span></div>
     <div><h3 id="nowName">Press any key</h3><p class="lede" id="nowSub">Try sliding your finger along the keys, or play only the black keys. They always sound good together.</p></div></div>
     <div class="setting"><span>Letters on the keys</span><div class="seg" id="segLab"><button aria-pressed="${store.labels}" data-v="1">Show</button><button aria-pressed="${!store.labels}" data-v="0">Hide</button></div></div>
     <div class="setting"><span>Sound</span><div class="seg" id="segSnd"><button aria-pressed="${store.sound==='piano'}" data-v="piano">Piano</button><button aria-pressed="${store.sound==='bells'}" data-v="bells">Music box</button></div></div>
   </div></div>`;
  $('#segLab').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.labels=b.dataset.v==='1';save();keysEl.classList.toggle('nolabels',!store.labels);$('#segLab').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#segSnd').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.sound=b.dataset.v;save();$('#segSnd').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));tone('G4')};
  activity={locked:false,targets:()=>[],onNote(n){
    const card=$('#nowCard'),sharp=n.includes('#'),l=n[0];
    card.className='bigcard'+(!sharp&&isLight(l)?' lt':'');card.style.cssText=`--c:${col(n)}`;
    card.innerHTML=`<b>${sharp?l+'♯':l}</b><span>${sharp?'black key':ANIMAL[l]}</span>`;
    $('#nowName').textContent=sharp?`${l} sharp`:`${l} for ${ANIMAL[l]}`;
    $('#nowSub').textContent=n==='C4'?'That is middle C, the centre of the piano.':sharp?`The black key just to the right of ${l}.`:`This ${l} is in octave ${n.slice(-1)}. Higher numbers sound higher.`;
  }};
}

    P.App.minimizeApp&&P.App.minimizeApp();})}catch(e){}
  try{P.StatusBar&&P.StatusBar.hide()}catch(e){}
  try{P.SplashScreen&&P.SplashScreen.hide()}catch(e){}
})();
updateStars();buildKeys();show('learn');
</script>
