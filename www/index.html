<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Little Keys</title>
<style>
@font-face{font-family:"Baloo 2";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one-screen app. Header + tabs on top, scrolling lesson stage in the middle, a real-looking keyboard docked at the bottom. */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --ink:#1B2240; --muted:#5A6386; --line:#D9E0EE; --chip:#E3E9F6;
  --lid:#1E2236; --felt:#9E2A3A; --key-white:#FDFDFB; --key-edge:#C9CEDB; --key-black:#1F2230; --key-black-top:#3A3F52;
  --n-C:#E5484D; --n-D:#F0812A; --n-E:#F2C21B; --n-F:#3AA65A; --n-G:#2D95D8; --n-A:#5B5BD6; --n-B:#A64FCF; --sharp:#F2C21B;
  --good:#2E9E5B; --bad:#D9483B;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121729; --surface:#1B2240; --ink:#EEF1FA; --muted:#A4ADCA; --line:#2C3458; --chip:#262E52; --lid:#0B0E1A; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#121729; --surface:#1B2240; --ink:#EEF1FA; --muted:#A4ADCA; --line:#2C3458; --chip:#262E52; --lid:#0B0E1A; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.key:focus-visible{outline:3px solid var(--n-G);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.01em;margin:0}
.brand span:nth-child(1){color:var(--n-C)}.brand span:nth-child(2){color:var(--n-D)}.brand span:nth-child(3){color:var(--n-E)}.brand span:nth-child(4){color:var(--n-G)}
.stars{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.stars b{color:var(--n-E)}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;width:100%;max-width:520px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,25,50,.15)}

/* stage */
.stage{flex:1;min-height:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.wrap{max-width:61rem;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.15;margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{color:var(--muted);margin:0;max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;background:var(--c,var(--n-G))}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:.9rem}
.rate{letter-spacing:2px;color:var(--line);font-size:1.05rem}
.rate i{font-style:normal;color:var(--n-E)}
.diff{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px 0}
.say{font-size:clamp(1.1rem,3vw,1.35rem);margin:0;max-width:52ch;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 18px;font-family:var(--f-display);font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:1.5em;margin:0;font-weight:700}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}

/* note bubbles */
.bubbles{position:relative;display:flex;gap:.8rem;overflow-x:auto;padding:14px 10px 10px;scrollbar-width:thin}
.bub{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:2.75rem}
.bub .dot{width:2.65rem;height:2.65rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:#fff;background:var(--c);transition:transform .2s,opacity .2s}
.bub.lt .dot{color:#2A2400}
.bub small{font-size:.85rem;color:var(--muted);white-space:nowrap}
.bub .fing{font-size:.72rem;font-weight:700;color:var(--muted)}
.bub.done .dot{opacity:.35;transform:scale(.85)}
.bub.cur .dot{transform:scale(1.1);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}
.bub.cur{gap:.55rem}
.bub.cur small{color:var(--ink);font-weight:700}

/* games */
.bigcard{align-self:center;width:min(240px,70vw);aspect-ratio:1;max-width:100%;border-radius:28px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display)}
.bigcard.lt{color:#2A2400}
.bigcard b{font-size:6.5rem;line-height:.9;font-weight:800}
.bigcard span{font-size:1.4rem;font-weight:700}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:50%;background:var(--chip)}
.pip.on{background:var(--good)}
.pip.miss{background:var(--bad)}
.pip.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--muted)}
.lives{font-size:1.2rem;letter-spacing:3px;color:var(--n-C)}
.status{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}

/* free play */
.now{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.now .bigcard{width:120px;border-radius:20px}
.now .bigcard b{font-size:3.6rem}.now .bigcard span{font-size:1rem}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
.seg{flex-wrap:wrap}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
details li{margin:4px 0}

/* keyboard dock */
.dock{flex:none;background:var(--lid);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px max(10px,env(safe-area-inset-bottom,0px))}
.lidline{max-width:1800px;margin:0 auto 6px;display:flex;justify-content:space-between;color:#8E95B0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
.keys{position:relative;display:flex;max-width:1800px;margin:0 auto;height:clamp(140px,30vh,340px);touch-action:none;user-select:none;-webkit-user-select:none;border-top:5px solid var(--felt)}
.key{-webkit-tap-highlight-color:transparent}
.white{flex:1;min-width:0;background:var(--key-white);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 10px 10px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:10px;transition:background .08s,transform .08s;transform-origin:top}
.white .lab{width:min(2.3rem,80%);aspect-ratio:1;border-radius:50%;background:var(--nc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(.8rem,2.4vw,1.25rem);line-height:1}
.white.lt .lab{color:#2A2400}
.white{container-type:inline-size}
.white .mid{font-size:clamp(9px,17cqw,12px);font-weight:700;color:#5E6580;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;max-width:100%;padding:0 2px;text-align:center;overflow-wrap:break-word}
.nolabels .white .lab{background:transparent;color:transparent;box-shadow:inset 0 -4px 0 var(--nc)}
.white.down,.white.held{background:color-mix(in srgb,var(--nc) 38%,var(--key-white));transform:scaleY(.985)}
.black{position:absolute;top:0;height:60%;background:linear-gradient(var(--key-black-top),var(--key-black) 30%);border-radius:0 0 7px 7px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.35);transition:background .08s}
.black.down,.black.held{background:var(--key-black-top)}
.key.target{animation:pulse 1.1s ease-in-out infinite}
.white.target{background:color-mix(in srgb,var(--nc) 22%,var(--key-white))}
.white.target::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--nc);animation:bob 1.1s ease-in-out infinite}
.black.target{background:linear-gradient(var(--sharp),#B88C00)}
.key.nope{animation:shake .3s}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--nc)}}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}

/* celebration */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:16px}
.modal .panel{max-width:380px;width:100%;text-align:center;align-items:center}
.bigstars{font-size:3rem;letter-spacing:6px;color:var(--line);line-height:1}
.bigstars i{font-style:normal;color:var(--n-E);display:inline-block;animation:pop .45s backwards}
.bigstars i:nth-child(2){animation-delay:.15s}.bigstars i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}

/* tablets and computers: scale the whole interface up so it fills the screen */
@media (min-width:900px) and (min-height:700px){html{font-size:18px}}
@media (min-width:740px) and (min-height:950px){html{font-size:19px}}
@media (min-width:1300px) and (min-height:850px){html{font-size:20px}}
@media (min-width:1800px) and (min-height:1000px){html{font-size:22px}}
@media (max-width:520px){
  .brand{font-size:1.35rem}
  .tabs button{font-size:.92rem;padding:7px 4px}
  .now{grid-template-columns:1fr;justify-items:center;text-align:center}
}
/* phones held sideways: one compact header row, taller keys */
@media (max-height:500px){
  .top{flex-wrap:nowrap;padding-block:max(6px,env(safe-area-inset-top,0px)) 4px}
  .brand{font-size:1.2rem;white-space:nowrap}
  .tabs{order:2;max-width:440px;margin-left:auto}
  .stars{order:3;margin-left:0}
  .tabs button{padding:5px 4px;font-size:.9rem}
  .lidline{display:none}
  .dock{padding-block:6px max(6px,env(safe-area-inset-bottom,0px))}
  .keys{height:40vh}
  .stage .eyebrow{display:none}
  .bubbles{padding:10px 8px 6px}
  .bub small{font-size:.8rem}
  .fb{min-height:0}
  .stage{padding-block:4px 8px}
  .panel{padding:12px;gap:8px}
  .say{font-size:1.05rem}
  h2{font-size:1.3rem}
  .back{padding:0}
  .wrap{gap:8px}
  .bub .dot{width:36px;height:36px;font-size:1.1rem}
  .bigcard{width:min(150px,30vh)}
  .bigcard b{font-size:4rem}
}

.songlevel{display:flex;flex-direction:column;gap:10px}
.lockmsg{flex-basis:100%;margin:0;color:var(--muted);font-size:.9rem}
.card.locked{opacity:.55;cursor:default}.card.locked .num{background:var(--muted)}
.card.nope{animation:shake .3s}
/* ---------- course ---------- */
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.maphead>div:first-child{min-width:0;flex:1 1 280px}
.stickers{display:flex;gap:10px;flex-wrap:wrap}
.sticker{display:flex;flex-direction:column;align-items:center;gap:4px;width:5.4rem;text-align:center;font-size:.75rem;font-weight:700;line-height:1.2}
.sticker i{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-style:normal;font-size:1.6rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.sticker.no{color:var(--muted)}.sticker.no i{background:var(--chip);color:var(--muted);box-shadow:none}
.sticker.big{width:auto;flex-direction:row;gap:12px;font-size:1rem;align-self:flex-start}
.sticker.big i{animation:pop .5s backwards}
.island{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.island.soon{background:transparent;border-style:dashed}
.island.soon h3{color:var(--muted)}
.ihead{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.ihead .eyebrow{flex-basis:100%}
.ucount{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.stones{display:flex;flex-wrap:wrap;gap:6px 8px;padding-bottom:20px}
.stone{display:flex;flex-direction:column;align-items:center;gap:4px;width:5.6rem;border:0;background:transparent;padding:4px 0;border-radius:12px}
.stone:nth-child(even){transform:translateY(16px)}
.stone .disc{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;background:var(--chip);color:var(--muted);border:3px solid transparent;font-variant-numeric:tabular-nums}
.stone.done .disc{background:var(--c);color:#fff}
.stone.open .disc{background:var(--surface);border-color:var(--c);color:var(--ink)}
.stone.next .disc{background:var(--surface);border-color:var(--c);color:var(--ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent);animation:bounce 1.4s ease-in-out infinite}
.stone.locked{cursor:default}.stone.locked .t{color:var(--muted)}
.stone .t{font-size:.78rem;line-height:1.2;text-align:center;color:var(--ink);font-weight:700}
.stone .rate{font-size:.8rem;letter-spacing:1px}
.stone.nope{animation:shake .3s}
@keyframes bounce{50%{translate:0 -6px}}
.grown{position:relative;overflow:hidden;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:700;color:var(--muted);touch-action:none;user-select:none;-webkit-user-select:none}
.grown .gfill{position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb,var(--n-G) 30%,transparent)}
.grown.holding .gfill{width:100%;transition:width 3s linear}
.grown .glab{position:relative}
.lesson{gap:10px}
.steps5{display:flex;gap:6px;list-style:none;padding:0;margin:0;flex-wrap:wrap}
.steps5 li{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.steps5 li.cur{background:var(--ink);color:var(--bg)}
.steps5 li.done{background:color-mix(in srgb,var(--good) 22%,var(--chip));color:var(--ink)}
.lbody{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.idea{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:30rem}
.choice{border:0;border-radius:20px;min-height:5.5rem;padding:12px;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.choice small{font-size:.95rem;font-weight:700;opacity:.9}
.choice.hint{animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 0 0 6px var(--surface),0 0 0 10px var(--c)}}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.bigcard.mini{width:5.5rem;border-radius:18px;align-self:auto}
.bigcard.mini b{font-size:2.6rem}.bigcard.mini span{font-size:.9rem}
.hand{width:min(15rem,56vw);max-width:100%;height:auto;align-self:center}
.hand.left{transform:scaleX(-1)}.hand.left text{transform-box:fill-box;transform-origin:center;transform:scaleX(-1)}
.hand .palm{fill:var(--chip);stroke:var(--muted);stroke-width:2.5}
.hand .finger path{fill:var(--surface);stroke:var(--muted);stroke-width:2.5;transition:fill .15s}
.hand .finger[role=button]{cursor:pointer}
.hand .finger[role=button]:hover path{fill:var(--chip)}
.hand .finger:focus{outline:none}.hand .finger:focus-visible path{stroke:var(--n-G);stroke-width:4}
.hand .finger.hint path{fill:var(--n-E);animation:fpulse 1s ease-in-out infinite}
@keyframes fpulse{50%{fill:var(--surface)}}
.hand text{fill:var(--ink);font-family:var(--f-display);font-weight:800;font-size:22px;text-anchor:middle;pointer-events:none}
.drum{width:6.5rem;height:6.5rem;border-radius:50%;background:var(--n-F);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2rem;align-self:center;transition:transform .08s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.drum.small{width:4rem;height:4rem;font-size:1.4rem}
.drum.hit{transform:scale(1.14)}
.beatrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bt{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--chip)}
.bt.now{box-shadow:0 0 0 3px var(--n-G)}.bt.on{background:var(--good)}
.hold{display:flex;flex-direction:column;gap:8px}
.holdlab{font-family:var(--f-display);font-weight:800;font-size:2.2rem;text-align:center;line-height:1}
.holdbar{position:relative;height:2.4rem;border-radius:999px;background:var(--chip);overflow:hidden}
.holdbar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 40%,transparent);border-left:3px solid var(--good)}
.holdbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--n-G);opacity:.85;border-radius:999px}
.rhythm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rb{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;transition:transform .1s}
.rb.ta{background:var(--n-C);color:#fff}.rb.shh{background:var(--chip);color:var(--muted)}
.rb.now{transform:scale(1.15);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--ink)}

<script>
const PCS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ANIMAL={C:'Cat',D:'Dog',E:'Elephant',F:'Frog',G:'Goat',A:'Ant',B:'Bear'};
const FINGER={C:1,D:2,E:3,F:4,G:5};
const midi=n=>{const m=n.match(/^([A-G]#?)(\d)$/);return PCS.indexOf(m[1])+12*(+m[2]+1)};
const hz=n=>440*Math.pow(2,(midi(n)-69)/12);
const pc=n=>n.replace(/\d/,'');
const isLight=l=>l==='E';
const col=n=>n.includes('#')?'var(--sharp)':`var(--n-${n[0]})`;
const matches=(t,n)=>/\d/.test(t)?t===n:pc(n)===t;
const $=s=>document.querySelector(s);
const stage=$('#stage'), keysEl=$('#keys'), modal=$('#modal');

/* ---------- saved progress & settings ---------- */
const store={best:{},labels:true,sound:'piano',octaves:'auto'};
try{Object.assign(store,JSON.parse(localStorage.getItem('littlekeys.v1')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('littlekeys.v1',JSON.stringify(store))}catch(e){}}
function award(id,s){if((store.best[id]||0)<s){store.best[id]=s;save()}updateStars()}
function updateStars(){$('#starCount').textContent=Object.values(store.best).reduce((a,b)=>a+b,0)}
const rate=s=>`<span class="rate">${[1,2,3].map(i=>i<=s?'<i>★</i>':'★').join('')}</span>`;

/* ---------- sound ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ac=new AC();
    master=ac.createGain();master.gain.value=.7;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}
  if(ac.state==='suspended')ac.resume();return ac;
}
function tone(note,delay=0,dur=0){
  const a=audio();if(!a)return;const t=a.currentTime+delay+.005,f=hz(note);
  const bells=store.sound==='bells',len=dur?Math.max(.2,dur+.12):bells?2.4:1.5;
  const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*9);lp.connect(g);g.connect(master);
  const parts=bells?[[1,'sine',1],[2.76,'sine',.22],[5.4,'sine',.07]]:[[1,'triangle',1],[2,'sine',.3],[3,'sine',.1]];
  parts.forEach(([m,type,v])=>{const o=a.createOscillator();o.type=type;o.frequency.value=f*m;const og=a.createGain();og.gain.value=v;o.connect(og);og.connect(lp);o.start(t);o.stop(t+len+.1)});
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.008);if(dur){g.gain.setValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.18,t+Math.max(.02,dur*.8));g.gain.exponentialRampToValueAtTime(.0001,t+len)}else{g.gain.exponentialRampToValueAtTime(.1,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+len)}
}

const nameOf=m=>PCS[m%12]+(Math.floor(m/12)-1);

/* how many octaves fit: never let a white key get narrower than about 30px */

function wantOctaves(){const pick=store.octaves==='auto'||!store.octaves?autoOctaves():+store.octaves;return Math.min(pick,maxOctaves())}
const START={1:4,2:4,3:3,4:2}; /* keep middle C on screen and near the middle */

function setRange(r){keyRange=r;buildKeys()}

  else{octaves=wantOctaves();lowOct=START[octaves];for(let o=lowOct;o<lowOct+octaves;o++)PCS.forEach(p=>notes.push(p+o));notes.push('C'+(lowOct+octaves))}

  });

  if(k&&k!==cur&&keysEl.contains(k)){release(cur.dataset.note);ptrs.set(e.pointerId,k);press(k.dataset.note,{slide:true})}});

addEventListener('pointerup',ptrUp);addEventListener('pointercancel',ptrUp);
function updateHint(){const h=$('#lidHint');if(!h)return;

  if(k==='z'||k==='x'){compOct=Math.min(Math.max(compOct+(k==='z'?-1:1),lowOct),lowOct+octaves-1);updateHint();e.preventDefault();return}
  if(!(k in KEYOFF))return;const n=nameOf((compOct+1)*12+KEYOFF[k]);if(keyEl(n)){e.preventDefault();kbDown[k]=n;press(n)}});

const downAt={};let lastPress=0;
function press(n,info={}){lastPress=performance.now();downAt[n]=lastPress;tone(n);flash(n);const k=keyEl(n);if(k)k.classList.add('held');

function bubbles(el,seq,i,{fingers=false}={}){
  el.innerHTML=seq.map((s,k)=>{const l=s.n[0];return `<div class="bub${isLight(l)?' lt':''}${k<i?' done':''}${k===i?' cur':''}" style="--c:${col(s.n)}"><span class="dot">${l}</span>${s.lyric?`<small>${s.lyric}</small>`:''}${fingers&&FINGER[l]?`<span class="fing">finger ${FINGER[l]}</span>`:''}</div>`}).join('');
  const cur=el.querySelector('.cur');if(cur)el.scrollTo({left:cur.offsetLeft-el.clientWidth/2+cur.offsetWidth/2,behavior:'smooth'});
}
function runner(seq,onStep,onDone){
  const r={i:0,mistakes:0,locked:false,
    targets:()=>r.i<seq.length?[seq[r.i].n]:[],
    onNote(n){if(r.i>=seq.length)return;
      if(matches(seq[r.i].n,n)){r.i++;onStep(true,n);glow();if(r.i>=seq.length)onDone()}
      else{r.mistakes++;nope(n);onStep(false,n)}}};
  return r;
}
function playBack(seq,bubEl,opts,bpm=100,after){
  const beat=60/bpm*1000;let t=300;activity.locked=true;
  seq.forEach((s,k)=>{later(()=>{tone(s.n);flash(s.n,Math.min(beat*s.beats*.8,500));bubbles(bubEl,seq,k,opts)},t);t+=beat*s.beats});
  later(()=>{activity.locked=false;after&&after()},t);
}
function fb(text,cls=''){const el=$('#fb');if(el){el.textContent=text;el.className='fb '+cls}}
const PRAISE=['Great!','Yes!','Super!','Well done!','Nice one!'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

function celebrate({title,msg,stars,again,next}){
  modal.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="bigstars">${[1,2,3].map(i=>i<=stars?'<i>★</i>':'★').join('')}</div><h2 id="ct">${title}</h2><p class="lede">${msg}</p><div class="row" style="justify-content:center">${next?'<button class="btn" id="mNext">Next</button>':''}<button class="btn ghost" id="mAgain">Play again</button><button class="btn ghost" id="mBack">Back</button></div></div>`;
  modal.hidden=false;fanfare();

  $('#mAgain').onclick=()=>{close();again()};$('#mBack').onclick=()=>{close();show(tab)};
  if(next)$('#mNext').onclick=()=>{close();next()};
  (next?$('#mNext'):$('#mAgain')).focus();
}

const levelOpen=k=>{const L=LEVELS.find(l=>l.k===k);return !!(store.unlockAll||(L&&isDone(L.need)))};
/* the keyboard shows just the notes a song needs, at least 5 white keys */
const songRange=seq=>{const ms=seq.map(x=>midi(x.n));let lo=Math.min(...ms),hi=Math.max(...ms);const white=m=>!nameOf(m).includes('#');
  while(!white(lo))lo--;while(!white(hi))hi++;const c4=midi('C4');if(lo>c4&&lo-c4<=5)lo=c4;const cnt=()=>{let c=0;for(let m=lo;m<=hi;m++)if(white(m))c++;return c};while(cnt()<5){hi++;while(!white(hi))hi++}
  return{from:nameOf(lo),to:nameOf(hi)}};

  stage.innerHTML=`<div class="wrap"><div><p class="eyebrow">Songs</p><h2>Play along with the glowing keys</h2></div>
  ${LEVELS.map(L=>{const open=levelOpen(L.k),ss=SONGS.map((g,i)=>({g,i})).filter(x=>x.g.level===L.k);
    return`<section class="songlevel"><div class="ihead"><h3>${L.k} songs</h3><span class="ucount">${ss.length} songs</span>${open?'':`<p class="lockmsg">Finish Unit ${L.unit} in Learn to unlock these songs.</p>`}</div>

    <p class="eyebrow">${g.level} · ${g.type}</p><h2>${g.title}</h2>

    activity.locked=true;const m=activity.mistakes,st=m<=2?3:m<=6?2:1;award('song:'+g.id,st);
    later(()=>celebrate({title:'You played it!',msg:m===0?'Not a single slip. Amazing!':`${m} little slip${m>1?'s':''}. Play again to win more stars.`,stars:st,again:()=>openSong(idx),next:SONGS[idx+1]&&levelOpen(SONGS[idx+1].level)?()=>openSong(idx+1):null}),500);

function openDetective(){
  clearTimers();const total=10;let round=0,results=[],target=null,first=true;
  function next(){
    if(round>=total)return finish();round++;first=true;let p;do{p='CDEFGAB'[Math.floor(Math.random()*7)]}while(p===target);target=p;
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All games</button><div class="panel">
      <p class="eyebrow">Note Detective · Round ${round} of ${total}</p>
      <div class="pips">${Array.from({length:total},(_,k)=>`<span class="pip ${results[k]===true?'on':results[k]===false?'miss':''}${k===round-1?' cur':''}"></span>`).join('')}</div>
      <div class="bigcard${isLight(target)?' lt':''}" style="--c:${col(target)}"><b>${target}</b><span>${ANIMAL[target]}</span></div>
      <p class="say" style="text-align:center;align-self:center">Find <strong>${target}</strong> on the keyboard.</p>
      <p class="fb" id="fb" style="text-align:center"></p><div class="row" style="justify-content:center"><button class="btn ghost" id="hint">Show me</button></div></div></div>`;
    $('#back').onclick=()=>show('games');
    let hint=false;
    activity={locked:false,targets:()=>hint?[target]:[],onNote(n){
      if(pc(n)===target){activity.locked=true;results[round-1]=first;const pp=document.querySelectorAll('.pips .pip')[round-1];if(pp){pp.classList.remove('cur');pp.classList.add(first?'on':'miss')}fb(pick(PRAISE),'ok');later(next,round>=total?1100:750)}
      else{first=false;nope(n);fb(n.includes('#')?'That was a black key. Try a white one!':`That was ${n[0]} for ${ANIMAL[n[0]]}. Try again!`,'no')}}};
    $('#hint').onclick=()=>{hint=true;first=false;glow()};glow();
  }
  function finish(){const c=results.filter(Boolean).length,st=c>=9?3:c>=6?2:c>=3?1:0;if(st)award('game:detective',st);
    celebrate({title:`${c} out of ${total}!`,msg:c>=9?'A real note detective.':'Keep practising and the letters will start to jump out.',stars:st,again:openDetective});}
  next();
}

function openCopyCat(){
  clearTimers();const MAX=8;let level=1,lives=3,seq=[],pos=0;
  const newSeq=()=>{const len=Math.min(2+Math.floor((level-1)/2),6);seq=Array.from({length:len},()=>'CDEFG'[Math.floor(Math.random()*5)]+'4')};
  function draw(msg){
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ All games</button><div class="panel" style="align-items:center;text-align:center">
      <p class="eyebrow">Copy Cat · Tune ${level} of ${MAX}</p><span class="lives" aria-label="${lives} lives">${'♥'.repeat(lives)}${'<span style="color:var(--line)">♥</span>'.repeat(3-lives)}</span>
      <p class="status" id="status">${msg}</p><div class="pips">${seq.map((_,k)=>`<span class="pip ${k<pos?'on':''}"></span>`).join('')}</div>
      <p class="lede">Copy Cat uses C, D, E, F and G. Keep your hand on five finger home.</p>
      <button class="btn ghost" id="again">Hear it again</button></div></div>`;
    $('#back').onclick=()=>show('games');$('#again').onclick=()=>{if(!activity.locked)playSeq()};
  }
  function playSeq(){
    activity.locked=true;pos=0;draw('Listen…');
    seq.forEach((n,i)=>later(()=>{tone(n);flash(n,380)},500+i*620));
    later(()=>{activity.locked=false;draw('Your turn!')},500+seq.length*620);
  }
  activity={locked:true,targets:()=>[],onNote(n){
    if(pc(n)===pc(seq[pos])){pos++;draw('Your turn!');
      if(pos===seq.length){activity.locked=true;draw(pick(PRAISE));
        if(level>=MAX)later(finish,700);else later(()=>{level++;newSeq();playSeq()},1000)}}
    else{nope(n);lives--;if(lives<=0){activity.locked=true;later(finish,500)}else{draw('Oops! Listen again.');activity.locked=true;later(playSeq,1100)}}}};
  function finish(){const done=lives>0?MAX:level-1,st=done>=8?3:done>=5?2:done>=2?1:0;if(st)award('game:copycat',st);
    celebrate({title:lives>0?'Copy Cat champion!':`You copied ${done} tune${done===1?'':'s'}`,msg:lives>0?'You played back every tune.':'Your ears get sharper every time you play.',stars:st,again:openCopyCat});}
  newSeq();draw('Get ready…');later(playSeq,400);
}

/* ================= COURSE (Learn tab) ================= */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const takeN=(a,n)=>shuffle(a).slice(0,n);
const today=()=>new Date().toLocaleDateString('en-CA');
store.course=store.course||{done:{}};store.miss=store.miss||{};store.log=store.log||{};store.stickers=store.stickers||[];

/* ---------- practice time (counts active playing, gaps over a minute are not counted) ---------- */
let lastAct=0,lastSave=0;
function trackPractice(){const now=Date.now(),d=today();
  store.log[d]=(store.log[d]||0)+(lastAct&&now-lastAct<60000?now-lastAct:1);lastAct=now;
  if(now-lastSave>10000){lastSave=now;save()}}
function weekStats(){const now=new Date(),dow=(now.getDay()+6)%7,days=[];
  for(let k=0;k<=dow;k++){const d=new Date(now);d.setDate(now.getDate()-k);days.push(d.toLocaleDateString('en-CA'))}
  const active=days.filter(d=>(store.log[d]||0)>0);
  return{days:active.length,mins:Math.round(active.reduce((s,d)=>s+store.log[d],0)/60000)}}
function daysSinceLast(){const ds=Object.keys(store.log).filter(d=>d<today()).sort();if(!ds.length)return null;
  return Math.round((new Date(today())-new Date(ds[ds.length-1]))/864e5)}

/* ---------- notes the child keeps missing (used by warm-ups and the parent area) ---------- */
function noteMiss(l){store.miss[l]=(store.miss[l]||0)+1;save()}
function noteHit(l){if(store.miss[l]){store.miss[l]--;save()}}

/* ---------- metronome ---------- */
function click(when,accent){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(accent?190:150,when);o.frequency.exponentialRampToValueAtTime(55,when+.12);
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(accent?1:.7,when+.005);g.gain.exponentialRampToValueAtTime(.0001,when+.2);
  o.connect(g);g.connect(master);o.start(when);o.stop(when+.22)}
/* plays count clicks; returns when each one is heard, on the page clock, plus the device's measured delay */
function scheduleBeats(tempo,count,onBeat){const a=audio();if(!a)return[];
  const spb=60/tempo,t0=a.currentTime+.6,out=((a.outputLatency||0)+(a.baseLatency||0))*1000,base=performance.now()+(t0-a.currentTime)*1000+out,times=[];
  for(let k=0;k<count;k++){click(t0+k*spb,k%4===0);const p=base+k*spb*1000;times.push(p+(store.latency||0));later(()=>onBeat&&onBeat(k),Math.max(0,p-performance.now()))}
  return times}

function handSVG(nums,clickable=true,left=false){

  const tip={1:[44,104],2:[82,60],3:[114,44],4:[146,56],5:[176,84]};

    <path class="palm" d="M60 112 H192 V170 a46 46 0 0 1 -46 42 H104 a46 46 0 0 1 -46 -42 z"/>

/* ---------- rounds: one small task each, with help after 2 misses ---------- */
function runRounds(body,rounds,{mode='play',tries=1,helpAfter=2}={},done){
  let i=0,res=[],slips=0,misses=0,roundMisses=0,helped=false,finished=false,answered=false;
  const ctl={mode,fb,slip(){slips++},result:k=>handle(k,null),helped:()=>helped};
  function draw(){
    const r=rounds[i];window.__round=r;answered=false;misses=0;roundMisses=0;helped=mode==='try';r.reset&&r.reset();
    body.innerHTML=`${rounds.length>1?`<div class="pips">${rounds.map((_,k)=>`<span class="pip ${k<i?(res[k]?'on':'miss'):''}${k===i?' cur':''}"></span>`).join('')}</div>`:''}
      <p class="say">${r.say}</p>${r.view?r.view():''}
      ${r.buttons?`<div class="choices">${r.buttons.map(b=>`<button class="choice" data-v="${b.v}" style="--c:${b.c}">${b.label}</button>`).join('')}</div>`:''}
      ${r.replay?'<div class="row"><button class="btn ghost" id="replay">Hear it again</button></div>':''}
      <p class="fb" id="fb"></p>`;
    body.querySelectorAll('[data-v]').forEach(b=>{b.onclick=()=>input({button:b.dataset.v});b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input({button:b.dataset.v})}}});
    const rp=body.querySelector('#replay');if(rp)rp.onclick=()=>{if(!activity.locked&&r.intro)playIntro(r)};
    activity={locked:false,targets:()=>(r.alwaysGlow||helped)&&r.targets?r.targets():[],
      onNote:(n,info)=>input({note:n,info}),onRelease:(n,ms)=>{if(r.usesRelease)input({release:ms,note:n})}};
    r.after&&r.after(body,ctl);glow();markHelp();
    if(r.autoIntro&&r.intro)later(()=>playIntro(r),300);
  }
  function playIntro(r){const at=i,act=activity;act.locked=true;const ms=r.intro()||0;later(()=>{if(activity===act&&at===i&&!answered){act.locked=false;glow()}},ms+150)}
  function markHelp(){const r=rounds[i];body.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
    if(helped&&r.hintSel){const e=body.querySelector(r.hintSel);e&&e.classList.add('hint')}}
  function input(inp){if(finished||answered||i>=rounds.length)return;const k=rounds[i].check(inp,ctl);handle(k,inp)}
  function handle(k,inp){if(!k||finished||answered||i>=rounds.length)return;const r=rounds[i];
    if(k==='no'){misses++;roundMisses++;slips++;if(inp&&inp.note)nope(inp.note);if(r.missKey)noteMiss(r.missKey);
      fb(r.wrongMsg?r.wrongMsg(inp):'Not that one. Try again!','no');
      if(misses>=helpAfter&&!helped&&(r.targets||r.hintSel)){helped=true;glow();markHelp();fb('Here it is! Look for the glowing one.','no')}return}
    if(k==='step'){misses=0;if(mode==='play'&&!r.alwaysGlow)helped=false;r.refresh&&r.refresh();glow();markHelp();fb('');return}
    if(k==='retry'){slips++;fb(r.retryMsg||"Let's try that one again.",'no');activity.locked=true;later(draw,1400);return}
    if(k==='ok'||k==='fail'){
      const right=k==='ok'&&(r.selfJudged||roundMisses<tries);
      if(k==='ok'&&r.missKey&&roundMisses===0)noteHit(r.missKey);
      res[i]=right;answered=true;activity.locked=true;
      fb(k==='ok'?(r.okMsg||pick(PRAISE)):(r.failMsg||'Good try! On to the next one.'),k==='ok'?'ok':'no');
      const pp=body.querySelectorAll('.pips .pip')[i];if(pp){pp.classList.remove('cur');pp.classList.add(right?'on':'miss')}
      i++;later(()=>{if(i>=rounds.length){finished=true;done({right:res.filter(Boolean).length,total:rounds.length,slips})}else draw()},k==='ok'?(r.okDelay||850):1500)}}
  draw();return ctl;
}

/* ---------- round types ---------- */
const LOWS=['C2','E2','G2','A2','C3'],HIGHS=['C6','E6','G6','A6','C7'];
function sideRound(){const low=Math.random()<.5,n=rnd(low?LOWS:HIGHS),ans=low?'low':'high';
  return{say:'Is this sound <b>low</b> like a bear, or <b>high</b> like a bird?',
    buttons:[{v:'low',label:'Low<small>Bear</small>',c:'var(--n-A)'},{v:'high',label:'High<small>Bird</small>',c:'var(--n-G)'}],
    hintSel:`[data-v="${ans}"]`,replay:true,autoIntro:true,intro(){tone(n);return 700},
    check(inp){let v=inp.button;if(inp.note){const ks=[...keysEl.querySelectorAll('.key')].map(k=>midi(k.dataset.note));v=midi(inp.note)<(Math.min(...ks)+Math.max(...ks))/2?'low':'high'}
      if(!v)return null;return v===ans?'ok':'no'},
    wrongMsg:()=>ans==='low'?'Listen again. That was a deep, low sound.':'Listen again. That was a high, tweety sound.'}}
function cleanRound(target){return{say:target?`Tap the glowing <b>${target[0]}</b> with one fingertip.`:'Tap any key with <b>one fingertip</b>. Keep the rest of your hand off the screen.',
  alwaysGlow:!!target,targets:()=>target?[target]:[],
  check(inp){if(!inp.note)return null;if(inp.info&&inp.info.multi)return'no';if(target&&inp.note!==target)return'no';return'ok'},
  wrongMsg:inp=>inp.info&&inp.info.multi?'Two keys at once! Lift your other fingers and try again.':`That was ${inp.note[0]}. Find the glowing key.`,okDelay:600}}
const FIND={twin:{say:'Tap one of the <b>twins</b>: a black key in a group of 2.',set:['C#','D#'],wrong:'Not a twin. Look for 2 black keys side by side.'},
  triplet:{say:'Tap a black key in a group of <b>3</b>.',set:['F#','G#','A#'],wrong:'Look for 3 black keys together.'},
  c:{say:'Find a <b>C</b>. It sits just left of the twins.',set:['C'],wrong:'C is the white key just left of the 2 black keys.',miss:'C'},
  mid:{say:'Find <b>middle C</b>. It has a little label.',set:['C4'],wrong:'Middle C is the C with the label under it.',miss:'C'}};
function findRound(k){const f=FIND[k];return{say:f.say,targets:()=>f.set,missKey:f.miss||null,
  check(inp){if(!inp.note)return null;return f.set.some(t=>matches(t,inp.note))?'ok':'no'},wrongMsg:()=>f.wrong}}
function handRound(f,nums,left=false){return{say:`Tap finger <b>${f}</b>${left?' on the left hand':''}.`,view:()=>handSVG(nums,true,left),hintSel:`[data-v="f${f}"]`,
  check(inp){if(!inp.button)return null;return inp.button==='f'+f?'ok':'no'},wrongMsg:inp=>`That is finger ${inp.button.slice(1)}. Find finger ${f}.`}}
function detectRound(L){return{say:`Find <b>${L}</b> on the keyboard.`,view:()=>`<div class="bigcard${isLight(L)?' lt':''}" style="--c:${col(L)}"><b>${L}</b><span>${ANIMAL[L]}</span></div>`,
  targets:()=>[L],missKey:L,check(inp){if(!inp.note)return null;return pc(inp.note)===L?'ok':'no'},
  wrongMsg:inp=>inp.note.includes('#')?'That was a black key. Try a white one!':`That was ${inp.note[0]} for ${ANIMAL[inp.note[0]]}. Try again!`}}
function patternRound(str,o={}){const seq=str.split(' ').map(n=>({n:/\d/.test(n)?n:n+'4'}));let j=0,sl=0,bub=null;const fo={fingers:!!o.fingers};
  return{say:o.say||(o.glow?'Play the glowing keys in order.':'Play these notes in order.'),view:()=>'<div class="bubbles" id="bub"></div>',
    after(b){bub=b.querySelector('#bub');bubbles(bub,seq,0,fo)},reset(){j=0;sl=0},alwaysGlow:!!o.glow,targets:()=>j<seq.length?[seq[j].n]:[],selfJudged:true,
    replay:true,autoIntro:!!o.listen,intro(){const st=650;seq.forEach((s,k)=>later(()=>{tone(s.n);flash(s.n,420);bub&&bubbles(bub,seq,k,fo)},k*st));later(()=>bub&&bubbles(bub,seq,j,fo),seq.length*st);return seq.length*st},
    refresh(){bubbles(bub,seq,j,fo)},
    check(inp){if(!inp.note||j>=seq.length)return null;if(inp.note===seq[j].n){j++;if(j<seq.length)return'step';return sl<=(o.maxSlips??2)?'ok':(o.repeat?'retry':'fail')}sl++;return'no'},
    wrongMsg:()=>`Look for ${seq[j].n[0]}.`,failMsg:'Good try! That one had a few slips.'}}
function sdRound(kind){const ns=['C4','D4','E4','F4','G4'];let a=rnd(ns),b,ans;
  if(kind==='sd'){const same=Math.random()<.45;b=same?a:rnd(ns.filter(x=>x!==a));ans=same?'same':'diff'}else{do{b=rnd(ns)}while(b===a);ans=midi(b)>midi(a)?'up':'down'}
  return{say:kind==='sd'?'Listen to two notes. Are they the <b>same</b> or <b>different</b>?':'Listen to two notes. Does the second one go <b>higher</b> or <b>lower</b>?',
    buttons:kind==='sd'?[{v:'same',label:'Same',c:'var(--n-G)'},{v:'diff',label:'Different',c:'var(--n-D)'}]:[{v:'up',label:'Higher',c:'var(--n-B)'},{v:'down',label:'Lower',c:'var(--n-A)'}],
    hintSel:`[data-v="${ans}"]`,replay:true,autoIntro:true,intro(){tone(a);later(()=>tone(b),850);return 1400},
    check(inp){if(!inp.button)return null;return inp.button===ans?'ok':'no'},wrongMsg:()=>'Listen again carefully.'}}

/* timed rounds use the drum */
const startBtn='<div class="row" style="justify-content:center"><button class="btn" id="go">Start the drum</button></div>';
function calibRound(){let times=[],taps=[];return{say:'First, a quick timing check. Tap any key every time you hear the drum.',
  view:()=>`<div class="drum" id="drum">♩</div>${startBtn}`,
  after(b,ctl){b.querySelector('#go').onclick=e=>{e.target.closest('.row').hidden=true;const drum=b.querySelector('#drum');
    times=scheduleBeats(80,10,k=>{drum.classList.add('hit');drum.textContent=k+1;later(()=>drum.classList.remove('hit'),120)});
    later(()=>{const off=taps.filter(x=>x.k>=2).map(x=>x.d).sort((a,b)=>a-b);
      if(off.length>=4)store.latency=Math.max(-80,Math.min(300,(store.latency||0)+off[Math.floor(off.length/2)]));else store.latency=store.latency||0;
      store.calibrated=true;save();ctl.result('ok')},times.length?times[times.length-1]-performance.now()+900:1000)}},
  check(inp){if(!inp.note||!times.length)return null;let best=-1,bd=1e9;times.forEach((t,k)=>{const d=lastPress-t;if(Math.abs(d)<Math.abs(bd)){bd=d;best=k}});
    if(Math.abs(bd)<450)taps.push({k:best,d:bd});return null},okMsg:'Thanks! Timing check done.'}}
function beatRound(n,tempo,need,isTry){let exp=[],hit=[],on=false;
  return{say:`Tap any key with the drum. The first 4 booms count you in, then tap along ${n} times.`,
    view:()=>`<div class="drum" id="drum">♩</div><div class="beatrow">${Array.from({length:n},(_,k)=>`<span class="bt" data-b="${k}"></span>`).join('')}</div>${startBtn}`,
    after(b,ctl){b.querySelector('#go').onclick=e=>{e.target.closest('.row').hidden=true;const drum=b.querySelector('#drum');
      const t=scheduleBeats(tempo,4+n,k=>{drum.classList.add('hit');later(()=>drum.classList.remove('hit'),120);
        if(k<4){drum.textContent=k+1}else{drum.textContent='Tap!';b.querySelectorAll('.bt').forEach(x=>x.classList.toggle('now',+x.dataset.b===k-4))}});
      exp=t.slice(4);hit=exp.map(()=>false);on=true;
      later(()=>{on=false;const h=hit.filter(Boolean).length;b.querySelectorAll('.bt').forEach(x=>x.classList.remove('now'));
        fb(`You tapped ${h} of ${n} beats in time.`,h>=need?'ok':'no');later(()=>ctl.result(isTry||h>=need?'ok':'fail'),1200)},exp[exp.length-1]-performance.now()+700)}},
    check(inp){if(!inp.note||!on)return null;let best=-1,bd=1e9;exp.forEach((t,k)=>{const d=Math.abs(lastPress-t);if(!hit[k]&&d<bd){bd=d;best=k}});
      if(best>=0&&bd<230){hit[best]=true;const el=document.querySelector(`.bt[data-b="${best}"]`);el&&el.classList.add('on')}return null},
    okMsg:'Great beat keeping!',failMsg:"Let's keep practising the beat."}}
const LEN={1:'ta',2:'ta-a',4:'ta-a-a-a'};
function holdRound(beats,tempo){const T=beats*60000/tempo,lo=.8*T,hi=T+Math.max(450,.35*T),span=hi*1.25;let holding=null,raf=0;
  return{beats,T,say:`Press a key and hold it until the bar reaches the green part, then let go. That is <b>${beats} beat${beats>1?'s':''}</b>.`,usesRelease:true,
    view:()=>`<div class="hold"><div class="holdlab">${LEN[beats]}</div><div class="holdbar"><div class="zone" style="left:${lo/span*100}%;width:${(hi-lo)/span*100}%"></div><div class="fill" id="hfill"></div></div></div>`,
    reset(){holding=null;cancelAnimationFrame(raf)},
    check(inp){const fill=document.getElementById('hfill');
      if(inp.release!=null){if(inp.note!==holding)return null;holding=null;cancelAnimationFrame(raf);const ms=inp.release;
        if(ms<lo){fill&&(fill.style.width='0%');return'no'}if(ms>hi){fill&&(fill.style.width='0%');return'no'}return'ok'}
      if(!inp.note||holding)return null;holding=inp.note;const t0=performance.now(),a=audio();if(a)for(let k=1;k<=beats;k++)click(a.currentTime+k*60/tempo,false);
      const tick=()=>{if(!holding||!fill)return;fill.style.width=Math.min(100,(performance.now()-t0)/span*100)+'%';raf=requestAnimationFrame(tick)};tick();return null},
    wrongMsg:()=>'Hold until the bar reaches the green part, then let go.'}}
function restRound(pat,tempo,isTry){const p=pat.split(' ');let exp=[],state=[],on=false;
  return{say:'Tap on <b>ta</b>. Stay quiet on <b>shh</b>. The drum counts you in first.',
    view:()=>`<div class="rhythm">${p.map((x,k)=>`<span class="rb ${x}" data-k="${k}">${x==='ta'?'ta':'shh'}</span>`).join('')}</div><div class="drum small" id="drum">♩</div>${startBtn}`,
    after(b,ctl){b.querySelector('#go').onclick=e=>{e.target.closest('.row').hidden=true;const drum=b.querySelector('#drum');
      const t=scheduleBeats(tempo,4+p.length,k=>{drum.classList.add('hit');later(()=>drum.classList.remove('hit'),120);drum.textContent=k<4?k+1:'';
        b.querySelectorAll('.rb').forEach(x=>x.classList.toggle('now',+x.dataset.k===k-4))});
      exp=t.slice(4);state=p.map(()=>null);on=true;
      later(()=>{on=false;b.querySelectorAll('.rb').forEach(x=>x.classList.remove('now'));let err=0;
        p.forEach((x,k)=>{const el=b.querySelector(`.rb[data-k="${k}"]`);if(x==='ta'&&!state[k]){err++;el.classList.add('bad')}if(x==='shh'&&state[k]){err++;el.classList.add('bad')}if(!el.classList.contains('bad'))el.classList.add('good')});
        later(()=>ctl.result(isTry||err<=1?'ok':'retry'),900)},exp[exp.length-1]-performance.now()+700)}},
    check(inp){if(!inp.note||!on)return null;let best=-1,bd=1e9;exp.forEach((t,k)=>{const d=Math.abs(lastPress-t);if(d<bd){bd=d;best=k}});if(best>=0&&bd<260)state[best]=true;return null},
    retryMsg:'Almost! Let\'s try that rhythm again.',selfJudged:true}}
function copyRound(pat,tempo,isTry){const spb=60000/tempo,seq=pat.map(([l,b])=>({n:l+'4',beats:b,lyric:isTry?LEN[b]:''}));let j=0,err=0,bub=null,holding=null;
  return{seq,say:isTry?'Listen, then play it back. Hold the long notes.':'Listen, then play it back with the right notes and lengths.',usesRelease:true,
    view:()=>'<div class="bubbles" id="bub"></div>',after(b){bub=b.querySelector('#bub');bubbles(bub,seq,0)},reset(){j=0;err=0;holding=null},
    alwaysGlow:isTry,targets:()=>j<seq.length?[seq[j].n]:[],selfJudged:true,replay:true,autoIntro:true,
    intro(){let t=0;seq.forEach((s,k)=>{const d=s.beats*spb;later(()=>{tone(s.n,0,d/1000*.92);flash(s.n,d*.9);bub&&bubbles(bub,seq,k)},t);t+=d});later(()=>bub&&bubbles(bub,seq,j),t);return t},
    refresh(){bubbles(bub,seq,j)},
    check(inp){if(j>=seq.length)return null;const s=seq[j];
      if(inp.release!=null){if(inp.note!==holding)return null;holding=null;const long=s.beats>=2,okLen=long?inp.release>=1.3*spb:inp.release<1.3*spb;
        if(!okLen){err++;fb(long?'That one should be longer.':'That one should be shorter.','no')}j++;
        if(j<seq.length)return'step';return err<=1||isTry?'ok':'fail'}
      if(!inp.note||holding)return null;if(inp.note!==s.n){err++;return'no'}holding=inp.note;return null},
    wrongMsg:()=>`Listen again. The next note is ${seq[j].n[0]}.`,failMsg:'Good try! Here comes the next one.'}}

const isDone=id=>!!store.course.done[id];
const unlocked=k=>k===0||store.unlockAll||isDone(COURSE[k-1].id);
const starsFor=slips=>slips<=1?3:slips<=3?2:1;

function warmRounds(){const pool=[];
  if(isDone('1.1'))pool.push(()=>sideRound());
  if(isDone('1.3'))pool.push(()=>findRound(rnd(['twin','triplet'])));
  if(isDone('1.5'))pool.push(()=>findRound('c'));
  const ls=[...(isDone('2.1')?['C','D','E']:[]),...(isDone('2.3')?['F','G']:[])];
  if(ls.length){const w=ls.flatMap(l=>Array(1+Math.min(4,store.miss[l]||0)).fill(l));pool.push(()=>detectRound(rnd(w)),()=>detectRound(rnd(w)))}
  return pool.length?R(3,()=>rnd(pool)()):[]}

/* ---------- the course map ---------- */
function viewLearn(){
  const ws=weekStats(),gap=daysSinceLast(),doneN=COURSE.filter(L=>isDone(L.id)).length;
  const nextIdx=COURSE.findIndex((L,k)=>!isDone(L.id)&&unlocked(k));
  const greet=doneN===0?'Tap the bouncing stone to start your first lesson.':gap!=null&&gap>=3&&!(store.log[today()]>0)?'Welcome back! Let\'s carry on where you left off.':ws.days?`You've practised ${ws.days} day${ws.days>1?'s':''} this week.`:'Ready for today\'s lesson?';
  stage.innerHTML=`<div class="wrap">
    <div class="maphead"><div><p class="eyebrow">Your piano journey</p><h2>${doneN===COURSE.length?'Units 1 to 3 complete!':'Learn to play, one step at a time'}</h2><p class="lede">${greet}</p></div>
      <div class="stickers" aria-label="Sticker book">${UNITS.filter(u=>!u.soon).map(u=>{const has=store.stickers.includes(u.n);return`<div class="sticker${has?'':' no'}" style="--c:${u.c}"><i>${has?'★':'?'}</i>${has?u.sticker:'Unit '+u.n}</div>`}).join('')}</div></div>
    ${UNITS.map(u=>{if(u.soon)return`<section class="island soon"><div class="ihead"><span class="eyebrow">Unit ${u.n}</span><h3>${u.name}</h3><span class="ucount">Coming soon</span></div></section>`;
      const ls=COURSE.map((L,k)=>({L,k})).filter(x=>x.L.unit===u.n),dn=ls.filter(x=>isDone(x.L.id)).length;
      return`<section class="island" style="--c:${u.c}"><div class="ihead"><span class="eyebrow">Unit ${u.n} · ${u.stage}</span><h3>${u.name}</h3><span class="ucount">${dn} of ${ls.length} done</span></div>
        <div class="stones">${ls.map(({L,k})=>{const d=isDone(L.id),open=unlocked(k),st=d?'done':k===nextIdx?'next':open?'open':'locked';
          return`<button class="stone ${st}" data-k="${k}" ${open?'':'aria-disabled="true"'} aria-label="Lesson ${L.id}, ${L.title}${d?', done':open?'':', locked'}"><span class="disc">${L.id}</span><span class="t">${L.title}</span>${d?rate(store.course.done[L.id]):''}</button>`}).join('')}</div></section>`}).join('')}
    <button class="grown" id="grown"><span class="gfill"></span><span class="glab">Grown-ups: press and hold</span></button>
  </div>`;
  stage.querySelectorAll('.stone').forEach(s=>s.onclick=()=>{const k=+s.dataset.k;if(unlocked(k))openCourseLesson(k);else{s.classList.remove('nope');void s.offsetWidth;s.classList.add('nope')}});
  holdToOpen($('#grown'),openParent);
  const nx=stage.querySelector('.stone.next');if(nx&&nx.getBoundingClientRect().top>stage.clientHeight)nx.scrollIntoView({block:'center'});
}

/* ---------- one lesson: warm-up, meet, try, play, celebrate ---------- */
function openCourseLesson(idx){
  clearTimers();modal.hidden=true;const L=COURSE[idx];
  if(L.zoom)setRange(L.zoom);else if(keyRange)setRange(null);
  const PH=['Warm-up','Meet','Try','Play','Celebrate'];
  function shell(p){clearTimers();activity=null;
    stage.innerHTML=`<div class="wrap"><button class="back" id="back">‹ Map</button><div class="panel lesson">
      <p class="eyebrow">Unit ${L.unit} · Lesson ${L.id}</p><h2>${L.title}</h2>
      <ol class="steps5" aria-label="Lesson steps">${PH.map((x,k)=>`<li class="${k<p?'done':k===p?'cur':''}"${k===p?' aria-current="step"':''}>${x}</li>`).join('')}</ol>
      <div class="lbody" id="lbody"></div></div></div>`;
    $('#back').onclick=()=>show('learn');stage.scrollTop=0;return $('#lbody')}
  function warm(){const rs=warmRounds();if(!rs.length)return meet();const b=shell(0);runRounds(b,rs,{mode:'warm'},meet)}
  function meet(){const b=shell(1);
    b.innerHTML=`<p class="idea">New: ${L.idea}</p><p class="say">${L.meet}</p>${L.meetView?L.meetView():''}
      <div class="row">${L.demo?`<button class="btn ghost" id="demo">${L.demoLabel}</button>`:''}<button class="btn" id="go">Let's try ›</button></div>`;
    activity={locked:false,targets:()=>L.meetGlow||[],onNote(){}};glow();
    if(L.demo)$('#demo').onclick=()=>L.demo();$('#go').onclick=tryIt}
  function tryIt(){const b=shell(2);runRounds(b,L.try(),{mode:'try',tries:L.tries||1},playIt)}
  function playIt(){const b=shell(3);runRounds(b,L.play(),{mode:'play',tries:L.tries||1},finish)}
  function finish(r){const passed=L.need?r.right>=L.need:true;
    if(L.id==='3.1')store.slow31=!passed;
    const b=shell(4);activity={locked:false,targets:()=>[],onNote(){}};
    if(!passed){save();b.innerHTML=`<p class="say">Let's practise that again.</p><p class="lede">You got ${r.right} of ${r.total}. You need ${L.need} to move on. Every try makes you better!</p>
      <div class="row"><button class="btn" id="again">Practise again</button><button class="btn ghost" id="map">Back to map</button></div>`;
      $('#again').onclick=tryIt;$('#map').onclick=()=>show('learn');return}
    const stars=starsFor(r.slips),first=!isDone(L.id);
    store.course.done[L.id]=Math.max(store.course.done[L.id]||0,stars);award('c'+L.id,stars);
    const U=UNITS[L.unit-1],newSticker=L.show&&!store.stickers.includes(L.unit);if(newSticker)store.stickers.push(L.unit);save();
    const nx=COURSE[idx+1];fanfare();
    b.innerHTML=`<div class="bigstars">${[1,2,3].map(i=>i<=stars?'<i>★</i>':'★').join('')}</div>
      <p class="say">${L.show?`Unit ${L.unit} complete!`:pick(['Brilliant work!','You did it!','Super playing!'])}</p>
      ${newSticker?`<div class="sticker big" style="--c:${U.c}"><i>★</i>New sticker: ${U.sticker}</div>`:''}
      <p class="lede">${stars<3?'Play it again any time to win more stars.':'Three stars!'} ${nx?`Next up: <b>${nx.id} ${nx.title}</b>.`:'Units 4 to 7 are coming soon.'}</p>
      <div class="row">${nx?'<button class="btn" id="next">Next lesson ›</button>':''}<button class="btn ghost" id="map">Back to map</button><button class="btn ghost" id="again">Play again</button></div>`;
    if(nx)$('#next').onclick=()=>openCourseLesson(idx+1);$('#map').onclick=()=>show('learn');$('#again').onclick=()=>openCourseLesson(idx);
    ($('#next')||$('#map')).focus()}
  warm();
}

/* ---------- grown-ups area (press and hold for 3 seconds) ---------- */
function holdToOpen(btn,fn){let t=null;const go=e=>{if(e&&e.type==='keydown'&&(e.repeat||!['Enter',' '].includes(e.key)))return;e&&e.preventDefault();btn.classList.add('holding');t=setTimeout(()=>{btn.classList.remove('holding');fn()},3000)};
  const stop=()=>{clearTimeout(t);btn.classList.remove('holding')};
  btn.addEventListener('pointerdown',go);['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('keydown',go);btn.addEventListener('keyup',stop);btn.onclick=e=>e.preventDefault()}
function openParent(){const ws=weekStats(),doneN=COURSE.filter(L=>isDone(L.id)).length;
  const weak=Object.entries(store.miss).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  modal.innerHTML=`<div class="panel parent" role="dialog" aria-modal="true" aria-labelledby="pt">
    <h2 id="pt">For grown-ups</h2>
    <dl class="stats"><div><dt>Lessons done</dt><dd>${doneN} of ${COURSE.length}</dd></div><div><dt>Days practised this week</dt><dd>${ws.days}</dd></div><div><dt>Time playing this week</dt><dd>${ws.mins} min</dd></div></dl>
    <p><b>Still learning:</b> ${weak.length?weak.map(l=>`${l} (${ANIMAL[l]||l})`).join(', '):'nothing stands out right now.'}</p>
    <div class="setting"><span>Unlock every lesson and song</span><div class="seg" id="segUnlock"><button data-v="0" aria-pressed="${!store.unlockAll}">Off</button><button data-v="1" aria-pressed="${!!store.unlockAll}">On</button></div></div>
    <div class="setting"><span>Rhythm timing check</span><button class="btn ghost" id="recal">${store.calibrated?'Do it again next time':'Not done yet'}</button></div>
    <details><summary>Tips</summary><ul>
      <li>Little and often works best: one 5 to 10 minute lesson a day.</li>
      <li>Let your child repeat lessons they enjoy. Repeats earn more stars.</li>
      <li>On a real piano or keyboard: sit tall, level with middle C, with curved fingers as if holding a bubble.</li>
      <li>Later, on a real keyboard, the C major scale uses the thumb tucking under after E. The app can't check fingers, so this is one for you to show.</li></ul></details>
    <div class="row"><button class="btn" id="pclose">Close</button></div></div>`;
  modal.hidden=false;
  $('#segUnlock').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.unlockAll=b.dataset.v==='1';save();$('#segUnlock').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#recal').onclick=e=>{store.calibrated=false;save();e.target.textContent='Will run at the next rhythm lesson'};
  $('#pclose').onclick=()=>{modal.hidden=true;modal.innerHTML='';show('learn')};$('#pclose').focus()}

/* ---------- phone app extras ---------- */
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){} /* play sound even with the iPhone silent switch on */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac)ac.suspend();});
(function(){const P=window.Capacitor&&window.Capacitor.Plugins;if(!P)return;
  try{P.App&&P.App.addListener('backButton',()=>{
    if(!modal.hidden){modal.hidden=true;show(tab);return}
    if($('#back')){$('#back').click();return}
    if(tab!=='learn'){show('learn');return}
    P.App.minimizeApp&&P.App.minimizeApp();})}catch(e){}
  try{P.StatusBar&&P.StatusBar.hide()}catch(e){}
  try{P.SplashScreen&&P.SplashScreen.hide()}catch(e){}
})();
updateStars();buildKeys();show('learn');
</script>
